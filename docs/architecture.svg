<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"
     role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">The browser connects to the Express server, which mounts four API routers. The diagram maps ten library modules, configuration, and the JSON store. A purple band shows the printable invoice path. Five numbered steps trace order placement from the browser to a saved order, with separate checkout and invoice calculations.</desc>

  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172c3c; }
      .title { font-size: 34px; font-weight: 750; }
      .section { font-size: 21px; font-weight: 700; }
      .name { font-size: 15px; font-weight: 700; }
      .heading { font-size: 12px; font-weight: 750; letter-spacing: 1.15px; fill: #405969; }
      .body { font-size: 13px; fill: #405969; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
      .small { font-size: 12px; fill: #405969; }
      .number { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .card { fill: #fff; stroke: #b9cbd3; }
      .library { fill: #f1f7f8; stroke: #c2d3db; }
      .file { fill: #f9f5ec; stroke: #d5c6a8; }
      .order { fill: #e8f6f7; stroke: #75aab1; }
      .ticket { fill: #f3ecfb; stroke: #ad92c8; }
      .ticket-text { fill: #59377b; }
      .line { fill: none; stroke: #607c89; stroke-width: 1.5; stroke-linejoin: round; }
      .sequence { fill: none; stroke: #216674; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#607c89"/>
    </marker>
    <marker id="order-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#216674"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#fbfcfa"/>
  <text class="title" x="40" y="62">ShopLedger architecture</text>
  <text class="body" x="42" y="89">Point of sale, inventory, Khata credit, and GST invoicing</text>
  <g aria-label="Legend">
    <rect class="ticket" x="954" y="43" width="17" height="17" rx="4"/>
    <text class="small ticket-text" x="980" y="56">Invoice ticket</text>
    <path class="line" d="M954 79 H971" marker-end="url(#arrow)"/>
    <text class="small" x="980" y="83">Selected calls and file access</text>
  </g>
  <path d="M40 111 H1160" stroke="#d3dfe2"/>

  <g aria-label="Component map">
    <text class="heading" x="40" y="138">BROWSER &amp; SERVER</text>
    <text class="heading" x="279" y="138">ROUTERS · routes/</text>
    <text class="heading" x="533" y="138">LIBRARY MODULES · lib/</text>
    <text class="heading" x="988" y="138">CONFIG &amp; DATA</text>

    <!-- The Express mount branches to the four routes. Library arrows show selected calls. -->
    <g class="line">
      <path d="M135 211 V244" marker-end="url(#arrow)"/>
      <path d="M230 283 H253 M253 180 V369"/>
      <path d="M253 180 H279" marker-end="url(#arrow)"/>
      <path d="M253 243 H279" marker-end="url(#arrow)"/>
      <path d="M253 306 H279" marker-end="url(#arrow)"/>
      <path d="M253 369 H279" marker-end="url(#arrow)"/>
      <path d="M485 180 H533" marker-end="url(#arrow)"/>
      <path d="M485 243 H533" marker-end="url(#arrow)"/>
      <path d="M485 306 H533" marker-end="url(#arrow)"/>
      <path d="M485 369 H533" marker-end="url(#arrow)"/>
      <path d="M727 180 H749" marker-end="url(#arrow)"/>
      <path d="M727 193 H738 V243 H749" marker-end="url(#arrow)"/>
      <path d="M727 369 H749" marker-end="url(#arrow)"/>
      <path d="M727 432 H749" marker-end="url(#arrow)"/>
      <path d="M943 180 H988" marker-end="url(#arrow)"/>
      <path d="M943 243 H965 V215 H988" marker-end="url(#arrow)"/>
      <path d="M943 306 H988" marker-end="url(#arrow)"/>
    </g>

    <g aria-label="Browser and server">
      <rect class="card" x="40" y="154" width="190" height="57" rx="8"/>
      <text class="name" x="54" y="176">public/</text>
      <text class="body" x="54" y="196">Browser UI</text>
      <text class="small" x="147" y="232">HTTP</text>

      <rect class="card" x="40" y="244" width="190" height="78" rx="8"/>
      <text class="name" x="54" y="266">server.js</text>
      <text class="body" x="54" y="287">Express · JSON · static UI</text>
      <text class="body" x="54" y="306">Mounts routers under /api</text>
    </g>

    <g aria-label="Express routers">
      <rect class="order" x="279" y="154" width="206" height="52" rx="8"/>
      <text class="name" x="293" y="175">routes/orders.js</text>
      <text class="body" x="293" y="194">Order register, place, cancel</text>

      <rect class="card" x="279" y="217" width="206" height="52" rx="8"/>
      <text class="name" x="293" y="238">routes/products.js</text>
      <text class="body" x="293" y="257">Product catalog and coupons</text>

      <rect class="card" x="279" y="280" width="206" height="52" rx="8"/>
      <text class="name" x="293" y="301">routes/customers.js</text>
      <text class="body" x="293" y="320">Khata &amp; settlements</text>

      <rect class="card" x="279" y="343" width="206" height="52" rx="8"/>
      <text class="name" x="293" y="364">routes/reports.js</text>
      <text class="body" x="293" y="383">Reports, preview, export</text>
    </g>

    <g aria-label="Library modules">
      <rect class="library" x="533" y="154" width="194" height="52" rx="8"/>
      <text class="name" x="547" y="175">lib/pricing.js</text>
      <text class="body" x="547" y="194">Checkout totals</text>

      <rect class="library" x="749" y="154" width="194" height="52" rx="8"/>
      <text class="name" x="763" y="175">lib/tax.js</text>
      <text class="body" x="763" y="194">HSN rates and GST split</text>

      <rect class="library" x="533" y="217" width="194" height="52" rx="8"/>
      <text class="name" x="547" y="238">lib/inventory.js</text>
      <text class="body" x="547" y="257">Stock checks and updates</text>

      <rect class="library" x="749" y="217" width="194" height="52" rx="8"/>
      <text class="name" x="763" y="238">lib/coupons.js</text>
      <text class="body" x="763" y="257">Coupon rules and discounts</text>

      <rect class="library" x="533" y="280" width="194" height="52" rx="8"/>
      <text class="name" x="547" y="301">lib/ledger.js</text>
      <text class="body" x="547" y="320">Balances and payments</text>

      <rect class="library" x="749" y="280" width="194" height="52" rx="8"/>
      <text class="name" x="763" y="301">lib/store.js</text>
      <text class="body" x="763" y="320">JSON storage and audit</text>

      <rect class="library" x="533" y="343" width="194" height="52" rx="8"/>
      <text class="name" x="547" y="364">lib/reports.js</text>
      <text class="body" x="547" y="383">Dashboard and GST audit</text>

      <rect class="ticket" x="749" y="343" width="194" height="52" rx="8"/>
      <text class="name ticket-text" x="763" y="364">lib/invoice.js</text>
      <text class="body ticket-text" x="763" y="383">GST figures and print view</text>

      <rect class="library" x="533" y="406" width="194" height="52" rx="8"/>
      <text class="name" x="547" y="427">lib/orders.js</text>
      <text class="body" x="547" y="446">Order records &amp; cancellation</text>

      <rect class="library" x="749" y="406" width="194" height="52" rx="8"/>
      <text class="name" x="763" y="427">lib/dates.js</text>
      <text class="body" x="763" y="446">Date formatting and filters</text>
    </g>

    <g aria-label="Configuration and storage">
      <rect class="file" x="988" y="154" width="172" height="75" rx="8"/>
      <text class="name" x="1002" y="176">config.js</text>
      <text class="body" x="1002" y="197">Shop and GST settings</text>
      <text class="body" x="1002" y="215">Coupons and inventory</text>

      <rect class="file" x="988" y="280" width="172" height="75" rx="8"/>
      <text class="name" x="1002" y="302">data/db.json</text>
      <text class="body" x="1002" y="323">Stock, sales, customers</text>
      <text class="body" x="1002" y="341">Settlements and audit</text>
    </g>
  </g>

  <g aria-label="Printable invoice path">
    <rect class="ticket" x="40" y="478" width="1120" height="68" rx="9"/>
    <text class="name ticket-text" x="54" y="503">Printable invoice</text>
    <text class="code ticket-text" x="54" y="525">GET /orders/:id/invoice</text>
    <path class="line" d="M244 512 H265" marker-end="url(#arrow)"/>
    <text class="name ticket-text" x="280" y="503">server.js</text>
    <text class="code ticket-text" x="280" y="525">store.read() → orders.get()</text>
    <path class="line" d="M501 512 H522" marker-end="url(#arrow)"/>
    <text class="name ticket-text" x="537" y="503">lib/invoice.js</text>
    <text class="code ticket-text" x="537" y="525">render() → computeInvoiceFigures()</text>
    <text class="body ticket-text" x="817" y="498">GST on gross at saved rate or 18% fallback.</text>
    <text class="body ticket-text" x="817" y="516">Percent coupon on subtotal + GST.</text>
    <text class="body ticket-text" x="817" y="534">Compares invoice and ledger totals.</text>
  </g>

  <g aria-label="Five steps for placing an order">
    <text class="section" x="40" y="582">Placing an order</text>
    <text class="code" x="234" y="581">routes/orders.js · POST /orders</text>
    <g class="sequence" marker-end="url(#order-arrow)">
      <path d="M223 678 H241"/>
      <path d="M445 678 H463"/>
      <path d="M679 678 H697"/>
      <path d="M914 678 H932"/>
    </g>

    <g>
      <rect class="order" x="40" y="602" width="183" height="154" rx="9"/>
      <circle cx="65" cy="628" r="12" fill="#216674"/>
      <text class="number" x="65" y="633">1</text>
      <text class="name" x="85" y="633">Submit cart</text>
      <text class="code" x="54" y="662">public/js/app.js</text>
      <text class="code" x="54" y="682">POST /api/orders</text>
      <text class="body" x="54" y="708">Items, customer, payment,</text>
      <text class="body" x="54" y="727">status, and coupon</text>
    </g>

    <g>
      <rect class="order" x="241" y="602" width="204" height="154" rx="9"/>
      <circle cx="266" cy="628" r="12" fill="#216674"/>
      <text class="number" x="266" y="633">2</text>
      <text class="name" x="286" y="633">Resolve items</text>
      <text class="code" x="255" y="662">store.read()</text>
      <text class="code" x="255" y="682">inventory.find()</text>
      <text class="code" x="255" y="702">inventory.check()</text>
      <text class="body" x="255" y="727">Catalog price, HSN, and stock</text>
    </g>

    <g>
      <rect class="order" x="463" y="602" width="216" height="154" rx="9"/>
      <circle cx="488" cy="628" r="12" fill="#216674"/>
      <text class="number" x="488" y="633">3</text>
      <text class="name" x="508" y="633">Price cart</text>
      <text class="code" x="477" y="662">coupons.validate()</text>
      <text class="code" x="477" y="682">pricing.computeTotals()</text>
      <text class="body" x="477" y="702">Allocate the pre-tax coupon,</text>
      <text class="body" x="477" y="720">then apply 5%, 12%, or 18%</text>
      <text class="body" x="477" y="738">GST to each discounted line.</text>
    </g>

    <g>
      <rect class="order" x="697" y="602" width="217" height="154" rx="9"/>
      <circle cx="722" cy="628" r="12" fill="#216674"/>
      <text class="number" x="722" y="633">4</text>
      <text class="name" x="742" y="633">Apply sale</text>
      <text class="body" x="711" y="659">Khata only · ledger.js</text>
      <text class="code" x="711" y="677">chargeOrderToKhata()</text>
      <text class="code" x="711" y="702">inventory.reserve()</text>
      <text class="code" x="711" y="722">orders.add()</text>
    </g>

    <g>
      <rect class="order" x="932" y="602" width="228" height="154" rx="9"/>
      <circle cx="957" cy="628" r="12" fill="#216674"/>
      <text class="number" x="957" y="633">5</text>
      <text class="name" x="977" y="633">Save and respond</text>
      <text class="code" x="946" y="662">store.appendAudit()</text>
      <text class="code" x="946" y="682">store.write()</text>
      <text class="body" x="946" y="702">Write order, stock, audit, and any</text>
      <text class="body" x="946" y="720">Khata debit to data/db.json.</text>
      <text class="body" x="946" y="738">Return HTTP 201 with order.</text>
    </g>
  </g>
</svg>
